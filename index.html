<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖堂馬槽照片特展與票選</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800/85 backdrop-blur-md sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⛪</span>
                <div>
                    <h1 class="text-xl font-bold text-amber-400">聖堂馬槽照片特展與票選</h1>
                    <p class="text-xs text-slate-400">欣賞各方精美馬槽，每人每張照片限投一票！</p>
                </div>
            </div>
            <button onclick="openUploadModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                <span>📷</span> 我要上傳馬槽照片
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- 分類標籤切換 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="filterCategory('all')" id="btn-all" class="category-btn px-5 py-2 rounded-full font-medium bg-amber-500 text-slate-950 transition-all cursor-pointer">全部作品</button>
            <button onclick="filterCategory('home')" id="btn-home" class="category-btn px-5 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all cursor-pointer">🏠 家裡佈置</button>
            <button onclick="filterCategory('travel')" id="btn-travel" class="category-btn px-5 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all cursor-pointer">🌍 旅途特別</button>
            <button onclick="filterCategory('ai')" id="btn-ai" class="category-btn px-5 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all cursor-pointer">🤖 AI 合成</button>
        </div>

        <!-- 照片卡片網格 -->
        <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 動態插入卡片 -->
        </div>
    </main>

    <!-- 圖片放大預覽 Modal (Lightbox) -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <div class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-2xl font-bold bg-slate-800/80 px-3 py-1 rounded-full hover:bg-slate-700">✕ 關閉</button>
            <img id="lightbox-img" src="" alt="放大照片" class="max-w-full max-h-[80vh] rounded-xl object-contain shadow-2xl">
            <p id="lightbox-caption" class="text-center text-slate-200 mt-3 font-medium text-lg"></p>
        </div>
    </div>

    <!-- 上傳彈窗 Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>📤</span> 上傳您的馬槽作品</h2>
            
            <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">您的姓名 / 署名</label>
                    <input type="text" id="author-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="例如：若望媽媽">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">作品類別</label>
                    <select id="photo-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
                        <option value="home">🏠 家裡佈置的馬槽</option>
                        <option value="travel">🌍 旅途中看到的特別馬槽</option>
                        <option value="ai">🤖 AI 合成的馬槽</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">作品標題與簡短故事</label>
                    <input type="text" id="photo-title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="例如：平安夜的小角落">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">選擇照片檔案</label>
                    <input type="file" id="photo-file" accept="image/*" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 cursor-pointer">
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="px-5 py-2.5 rounded-xl bg-slate-700 text-slate-300 hover:bg-slate-600 cursor-pointer">取消</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-600 cursor-pointer">確認上傳</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        // 初始照片清單（您可以隨時在此刪除或修改預設範例）
        let photos = [
            // 若要刪除預設照片，直接把下面這幾行刪除即可；若要新增真實作品，改掉 url 即可
        ];

        let currentFilter = 'all';

        window.onload = function() {
            // 從瀏覽器記憶載入投票紀錄與最新照片
            const savedPhotos = localStorage.getItem('manger_photos');
            if (savedPhotos) {
                photos = JSON.parse(savedPhotos);
            }
            renderPhotos();
        };

        function saveToStorage() {
            localStorage.setItem('manger_photos', JSON.stringify(photos));
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? photos 
                : photos.filter(p => p.category === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 bg-slate-800/40 border border-slate-700 rounded-2xl">目前還沒有照片，點擊右上角「我要上傳馬槽照片」來分享第一張作品吧！</div>`;
                return;
            }

            // 檢查這支手機是否已經投過該張照片
            let userVotes = JSON.parse(localStorage.getItem('manger_user_votes') || '{}');

            filtered.forEach(photo => {
                const categoryNames = { home: '🏠 家裡佈置', travel: '🌍 旅途特別', ai: '🤖 AI 合成' };
                const hasVoted = userVotes[photo.id] === true;
                
                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between transition-transform duration-300 hover:-translate-y-1';
                card.innerHTML = `
                    <div>
                        <div class="relative h-56 overflow-hidden bg-slate-900 cursor-pointer" onclick="openLightbox('${photo.url}', '${photo.title} (${photo.author})')">
                            <img src="${photo.url}" alt="${photo.title}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
                            <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-amber-400 text-xs px-3 py-1 rounded-full font-medium">
                                ${categoryNames[photo.category]}
                            </span>
                            <span class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-lg">
                                🔍 點擊看大圖
                            </span>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-lg text-slate-100 mb-1">${photo.title}</h3>
                            <p class="text-sm text-slate-400">投稿人：${photo.author}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between border-t border-slate-700/50 mt-4 pt-4">
                        <span class="text-amber-400 font-bold flex items-center gap-1.5">
                            <span>❤️</span> <span id="vote-count-${photo.id}">${photo.votes}</span> 票
                        </span>
                        <button onclick="votePhoto(${photo.id})" id="vote-btn-${photo.id}" class="${hasVoted ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold cursor-pointer'} px-4 py-2 rounded-xl text-sm transition-all">
                            ${hasVoted ? '✓ 已投過票' : '👍 投這一票'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-5 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all cursor-pointer";
            });
            document.getElementById(`btn-${cat}`).className = "category-btn px-5 py-2 rounded-full font-medium bg-amber-500 text-slate-950 transition-all cursor-pointer";
            renderPhotos();
        }

        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('upload-form').reset();
        }

        function openLightbox(url, caption) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').innerText = caption;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function votePhoto(id) {
            let userVotes = JSON.parse(localStorage.getItem('manger_user_votes') || '{}');
            
            // 檢查是否投過
            if (userVotes[id]) {
                alert('這支手機或電腦已經投過這張照片囉！每人每張照片限投一票。');
                return;
            }

            const photo = photos.find(p => p.id === id);
            if (photo) {
                photo.votes += 1;
                userVotes[id] = true;
                localStorage.setItem('manger_user_votes', JSON.stringify(userVotes));
                saveToStorage();
                renderPhotos();
            }
        }

        function handleUpload(event) {
            event.preventDefault();
            const author = document.getElementById('author-name').value;
            const category = document.getElementById('photo-category').value;
            const title = document.getElementById('photo-title').value;
            const fileInput = document.getElementById('photo-file');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newPhoto = {
                        id: Date.now(),
                        title: title,
                        author: author,
                        category: category,
                        url: e.target.result,
                        votes: 0
                    };
                    photos.unshift(newPhoto);
                    saveToStorage();
                    renderPhotos();
                    closeUploadModal();
                    alert('上傳成功！照片已經即時展出囉。');
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
