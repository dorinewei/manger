<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖堂聖誕馬槽特展與票選</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 text-gray-800 min-h-screen">
    <header class="bg-amber-800 text-white py-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">🌟 聖堂聖誕馬槽特展暨票選 🌟</h1>
        <p class="mt-2 text-amber-200">欣賞各類溫馨馬槽，投下您最喜愛的一票！</p>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">
        <!-- 分類導覽與上傳按鈕 -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <div class="flex gap-2">
                <button onclick="switchTab('home')" id="btn-home" class="px-4 py-2 rounded-lg font-bold bg-amber-700 text-white shadow">🏠 家裡佈置</button>
                <button onclick="switchTab('travel')" id="btn-travel" class="px-4 py-2 rounded-lg font-bold bg-amber-200 text-amber-900">✈️ 旅途見聞</button>
                <button onclick="switchTab('ai')" id="btn-ai" class="px-4 py-2 rounded-lg font-bold bg-amber-200 text-amber-900">🤖 AI 合成</button>
            </div>
            <button onclick="openUploadModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 rounded-lg font-bold shadow">📤 上傳我的馬槽照片</button>
        </div>

        <!-- 照片展示網格 -->
        <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- 動態載入 -->
        </div>
    </main>

    <!-- 上傳彈跳視窗 -->
    <div id="upload-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-xl">
            <h2 class="text-2xl font-bold mb-4 text-amber-900">上傳馬槽照片</h2>
            <form id="upload-form" onsubmit="handleUploadSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">選擇類別</label>
                    <select id="up-category" class="w-full border rounded-lg p-2">
                        <option value="home">家裡的馬槽佈置</option>
                        <option value="travel">旅途中的特別馬槽</option>
                        <option value="ai">AI合成的馬槽</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">作品標題</label>
                    <input type="text" id="up-title" required class="w-full border rounded-lg p-2" placeholder="例如：平安夜的小角落">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">提供者姓名 / 稱呼</label>
                    <input type="text" id="up-uploader" required class="w-full border rounded-lg p-2" placeholder="例如：瑪利亞">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">選擇照片檔案</label>
                    <input type="file" id="up-file" accept="image/*" required class="w-full border rounded-lg p-2">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 bg-gray-300 rounded-lg">取消</button>
                    <button type="submit" id="submit-btn" class="px-4 py-2 bg-amber-700 text-white rounded-lg font-bold">確認上傳</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "您的_Google_Apps_Script_部署網址";
        let currentCategory = 'home';
        let allPhotos = [];

        // 取得瀏覽器專屬 Token 防止重複投票
        let deviceToken = localStorage.getItem('manger_token');
        if (!deviceToken) {
            deviceToken = 'DEV_' + Math.random().toString(36).substring(2) + Date.now();
            localStorage.setItem('manger_token', deviceToken);
        }

        async function fetchPhotos() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.status === 'success') {
                    allPhotos = data.photos;
                    renderPhotos();
                }
            } catch (err) {
                console.error("載入失敗", err);
            }
        }

        function switchTab(cat) {
            currentCategory = cat;
            ['home', 'travel', 'ai'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-4 py-2 rounded-lg font-bold bg-amber-700 text-white shadow";
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-bold bg-amber-200 text-amber-900";
                }
            });
            renderPhotos();
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-grid');
            const filtered = allPhotos.filter(p => p.category === currentCategory);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">目前還沒有這個類別的照片，快來上傳第一張吧！</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                    <img src="${p.imageUrl}" alt="${p.title}" class="h-56 w-full object-cover cursor-pointer" onclick="window.open('${p.imageUrl}', '_blank')">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg text-amber-900">${p.title}</h3>
                            <p class="text-sm text-gray-500">提供者：${p.uploader}</p>
                        </div>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-amber-700 font-bold">❤️ 獲得 ${p.votes} 票</span>
                            <button onclick="votePhoto('${p.id}')" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow">為它投票</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

        async function handleUploadSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "上傳中...";
            btn.disabled = true;

            const fileInput = document.getElementById('up-file');
            const file = fileInput.files[0];
            
            const reader = new FileReader();
            reader.onload = async function() {
                const payload = {
                    action: "upload",
                    category: document.getElementById('up-category').value,
                    title: document.getElementById('up-title').value,
                    uploader: document.getElementById('up-uploader').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: reader.result
                };

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (result.status === 'success') {
                        alert("上傳成功！");
                        closeUploadModal();
                        document.getElementById('upload-form').reset();
                        fetchPhotos();
                    } else {
                        alert("上傳失敗：" + result.message);
                    }
                } catch (err) {
                    alert("發生錯誤：" + err);
                } finally {
                    btn.innerText = "確認上傳";
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }

        async function votePhoto(photoId) {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "vote",
                        photoId: photoId,
                        deviceToken: deviceToken
                    })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert("投票成功！謝謝您的參與 ❤️");
                    fetchPhotos();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("投票發生錯誤");
            }
        }

        fetchPhotos();
    </script>
</body>
</html>
